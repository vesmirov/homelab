services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - /mnt/vault/vaultwarden:/data
    mem_limit: 256m
    memswap_limit: 256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/alive"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    depends_on:
      - vaultwarden
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /mnt/vault/caddy/data:/data
      - /mnt/vault/caddy/config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      VAULT_HOST: ${VAULT_HOST}
    mem_limit: 64m
    memswap_limit: 64m
